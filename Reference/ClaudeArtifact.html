<title>FocusTalk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&display=swap">
<style>
:root{
  /* Layout: one screen and no page scroll, always dark. The tomato timer is the content layer on a dark studio backdrop;
     Liquid Glass chrome floats above it (top button, dock, caption) and every detail opens in a glass sheet. */
  --bg-top:#14181E;
  --bg-bottom:#07080B;
  --bloom-tomato:rgba(255,72,50,.22);
  --bloom-leaf:rgba(34,160,128,.12);
  --bloom-sky:rgba(96,108,255,.12);
  --glow-focus:rgba(255,72,50,.34);
  --glow-rest:rgba(48,209,88,.26);
  --label:#FFFFFF;
  --label-2:rgba(235,235,245,.70);
  --label-3:rgba(235,235,245,.42);
  --hair:rgba(235,235,245,.14);
  --fill:rgba(120,120,128,.24);
  --fill-2:rgba(120,120,128,.38);
  --tint:#FF453A;
  --on-tint:#FFFFFF;
  --rest:#30D158;
  --ring:#0A84FF;
  --glass:rgba(46,50,58,.46);
  --glass-sheet:rgba(28,31,37,.86);
  --glass-hi:rgba(255,255,255,.42);
  --glass-lo:rgba(255,255,255,.08);
  --glass-line:rgba(255,255,255,.09);
  --glass-shade:rgba(0,0,0,.62);
  --scrim:rgba(0,0,0,.42);
  --font:-apple-system,BlinkMacSystemFont,"Geist","Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
  --t-time:clamp(44px,10dvh,92px);
  --t-title:clamp(20px,3.2dvh,27px);
  --r-sheet:32px;
  --blur:24px;
  --spring:cubic-bezier(.3,1.32,.5,1);
  --ease:cubic-bezier(.25,.8,.25,1);
  color-scheme:dark;
  box-sizing:border-box;
  height:100%;
}

[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background-color:var(--bg-bottom);background-image:radial-gradient(70% 44% at 50% 30%,var(--bloom-tomato),transparent 72%),radial-gradient(56% 40% at 0% 100%,var(--bloom-leaf),transparent 70%),radial-gradient(56% 40% at 100% 96%,var(--bloom-sky),transparent 70%),linear-gradient(180deg,var(--bg-top),var(--bg-bottom));color:var(--label);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;margin:0;background:none;border:0}
svg{flex:none}
:focus-visible{outline:2.5px solid var(--ring);outline-offset:3px}

/* ---------- frame ---------- */
.app{box-sizing:border-box;height:100%;max-width:900px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.mark .t{fill:var(--tint)}
.mark .l{fill:var(--rest)}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-line),0 12px 30px -14px var(--glass-shade),0 1px 4px -1px var(--glass-shade)}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 85% at 25% -12%,var(--glass-hi),transparent 58%);opacity:.55}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;background:linear-gradient(155deg,var(--glass-hi),var(--glass-lo) 28%,transparent 48%,transparent 62%,var(--glass-lo) 82%,var(--glass-hi));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.glass{background:var(--glass-sheet)}}
@media (prefers-reduced-transparency:reduce){.glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-sheet)}}

/* ---------- buttons ---------- */
.icon-btn{width:52px;height:52px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--label);transition:transform .4s var(--spring),opacity .25s var(--ease),color .25s var(--ease)}
.icon-btn svg{width:24px;height:24px}
.icon-btn.sm{width:40px;height:40px}
.icon-btn.sm svg{width:19px;height:19px}
.icon-btn:active:not(:disabled){transform:scale(.88)}
.icon-btn:disabled{opacity:.38;cursor:default}
.icon-btn .g{display:none}
.icon-btn[data-icon="play"] .g-play,.icon-btn[data-icon="pause"] .g-pause,.icon-btn[data-icon="again"] .g-again{display:grid}
.close{background:var(--fill);color:var(--label-2)}
.badge{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--tint);box-shadow:0 0 0 2px var(--bg-top)}
.ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--tint);opacity:0;pointer-events:none}
.icon-btn.call{color:var(--tint)}
.icon-btn.call .ring{animation:call 1.8s var(--ease) infinite}
@keyframes call{0%{transform:scale(.92);opacity:.75}80%,100%{transform:scale(1.28);opacity:0}}

.glass.talk{width:76px;height:76px;padding:0;border-radius:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--on-tint);background:var(--tint);background:color-mix(in srgb,var(--tint) 90%,transparent);transition:width .55s var(--spring),transform .4s var(--spring);overflow:hidden}
.glass.talk:active{transform:scale(.94)}
.talk[data-state="listening"]{width:164px}
.talk .g{display:none;align-items:center;justify-content:center;gap:10px}
.talk[data-state="idle"] .g-mic,.talk[data-state="listening"] .g-listen,.talk[data-state="thinking"] .g-think,.talk[data-state="speaking"] .g-speak{display:flex}
.talk svg{width:30px;height:30px}
.talk .lbl{font-size:17px;font-weight:600;white-space:nowrap}
.bars{display:flex;align-items:center;gap:3px;height:22px}
.bars i{display:block;width:3.5px;height:22px;border-radius:2px;background:currentColor;transform:scaleY(.35);animation:bar 1.1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.75s}
.bars i:nth-child(3){animation-delay:-.35s}
.bars i:nth-child(4){animation-delay:-.95s}
@keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{animation:wave 1.2s ease-in-out infinite}
.wave.w2{animation-delay:.3s}
@keyframes wave{0%,100%{opacity:.35}50%{opacity:1}}
.quiet{position:absolute;left:22px;right:22px;bottom:11px;height:2px;border-radius:1px;background:currentColor;opacity:.6;transform:scaleX(0);transform-origin:left center;pointer-events:none}
.quiet.run{animation:quiet var(--quiet,3s) linear forwards}
@keyframes quiet{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;container-type:size}
.hero{position:absolute;left:50%;top:50%;width:min(96cqw,96cqh);aspect-ratio:1;transform:translate(-50%,-50%)}
.halo{position:absolute;inset:10%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,var(--glow-focus),transparent 74%);opacity:.45;transition:opacity .8s var(--ease)}
.hero[data-kind="focus"] .halo{opacity:.85}
.hero[data-kind="break"] .halo{background:radial-gradient(closest-side,var(--glow-rest),transparent 74%);opacity:.85}
.stage[data-listen="1"] .halo{opacity:1;animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.07)}}
.float{position:absolute;inset:0;display:grid;place-items:center;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-1.1%)}50%{transform:translateY(1.1%)}}
.timer{position:relative;width:86%;aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.timer.dragging{cursor:grabbing}
.timer[aria-disabled="true"]{cursor:default}
.timer:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.tomato-img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-drag:none;pointer-events:none;filter:drop-shadow(0 22px 26px rgba(0,0,0,.6))}
.dial{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage[data-listen="1"] .timer{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03)}}
.stage .timer.rattle{animation:rattle .09s linear 18}
@keyframes rattle{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-.5%,0) rotate(-1deg)}75%{transform:translate(.5%,0) rotate(1deg)}}

.caption{position:absolute;left:50%;bottom:6px;box-sizing:border-box;width:min(520px,100%);max-height:calc(100% - 12px);overflow:hidden;border-radius:24px;padding:13px 18px 15px;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .28s var(--ease),transform .5s var(--spring)}
.caption.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.app.kb .caption{top:6px;bottom:auto}
.said{margin:0 0 3px;font-size:13px;line-height:1.35;color:var(--label-2);overflow-wrap:anywhere}
.said:empty{display:none}
.reply{margin:0;font-size:17px;line-height:1.38;font-weight:500;overflow-wrap:anywhere}
.reply.muted{color:var(--label-2);font-weight:400}
.reply.wait{background:linear-gradient(90deg,var(--label-2) 0%,var(--label) 45%,var(--label-2) 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.8s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.cap-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- readout ---------- */
.readout{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:4px 14px;min-width:0}
.kind{font-size:13px;font-weight:600;color:var(--label-2);letter-spacing:.01em;min-height:18px}
.time{display:flex;justify-content:center;font-size:var(--t-time);font-weight:200;line-height:1;letter-spacing:-.02em;margin-block:4px 8px}
.time .d{display:inline-block;width:.6em;text-align:center}
.time .c{display:inline-block;width:.26em;text-align:center;transform:translateY(-.06em)}
.title{margin:0;font-size:var(--t-title);font-weight:650;line-height:1.15;letter-spacing:-.018em;max-width:24ch;text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:6px 0 0;font-size:16px;line-height:1.38;color:var(--label-2);max-width:38ch;text-wrap:pretty}
.next{margin:4px 0 0;font-size:14px;line-height:1.35;color:var(--label-2)}
.sub:empty,.next:empty{display:none}
.chip{margin-top:14px;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;color:var(--label);transition:transform .4s var(--spring)}
.chip:active{transform:scale(.95)}

.dock{display:flex;align-items:center;justify-content:center;gap:22px;transition:opacity .3s var(--ease)}
.app[inert] .dock{opacity:0}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;transition:opacity .3s var(--ease)}
.scrim.open{opacity:1}
.sheet{position:fixed;z-index:31;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box;width:min(540px,calc(100% - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;border-radius:var(--r-sheet);background:var(--glass-sheet);transform:translate(-50%,28px) scale(.97);opacity:0;transition:transform .55s var(--spring),opacity .22s var(--ease)}
.sheet.open{transform:translate(-50%,0) scale(1);opacity:1}
.grabber{position:absolute;top:7px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--fill-2)}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:24px 18px 4px 24px}
.sheet-head h2{margin:0;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.sheet-head p{margin:4px 0 0;font-size:14px;color:var(--label-2)}
.sheet-body{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 24px 24px}

.task-chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px;padding:0;list-style:none}
.task-chips li{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 12px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;overflow-wrap:anywhere}
.dots{display:inline-flex;flex-wrap:wrap;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--tint)}
.dot.done{background:var(--tint)}
.dot.cur,.dot.part{background:linear-gradient(90deg,var(--tint) 50%,transparent 50%)}
.dot.skipped{opacity:.35}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tl{display:grid;grid-template-columns:4.4em 4px minmax(0,1fr) auto;column-gap:12px;padding:7px 10px 7px 4px;border-radius:14px}
.tl .t{font-size:13px;color:var(--label-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.tl .bar{border-radius:2px;background:var(--tint);opacity:.85}
.tl .lbl{min-width:0;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.tl .lbl b{font-weight:600}
.tl .lbl small{display:block;margin-top:1px;font-size:13px;color:var(--label-2)}
.tl .m{font-size:13px;color:var(--label-2);white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.tl.brk{padding-block:3px}
.tl.brk .bar{background:var(--rest);opacity:.75}
.tl.brk .lbl{font-size:13px;color:var(--label-2)}
.tl.cur{background:var(--fill)}
.tl.done .lbl,.tl.skipped .lbl{color:var(--label-2)}
.tl.done .bar,.tl.skipped .bar{opacity:.3}
.tl.skipped .lbl b{text-decoration:line-through}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{flex:1 1 auto;min-height:46px;border-radius:999px;padding:11px 20px;font-size:16px;font-weight:600;cursor:pointer;background:var(--fill);color:var(--label);transition:transform .4s var(--spring)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.primary{background:var(--tint);color:var(--on-tint)}
.btn:disabled{opacity:.4;cursor:default}
.empty{margin:4px 0 0;font-size:15px;line-height:1.45;color:var(--label-2);max-width:40ch}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:82px;padding:14px;border-radius:20px;background:var(--fill);font-size:15px;font-weight:600;text-align:left;cursor:pointer;transition:transform .4s var(--spring),background .2s var(--ease),color .2s var(--ease)}
.tile svg{width:22px;height:22px;color:var(--tint)}
.tile:active:not(:disabled){transform:scale(.96)}
.tile:disabled{opacity:.38;cursor:default}
.tile.warn{background:var(--tint);color:var(--on-tint)}
.tile.warn svg{color:var(--on-tint)}
.group{margin-top:16px;border-radius:20px;background:var(--fill);padding:0 16px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;cursor:pointer}
.setting+.setting{border-top:.5px solid var(--hair)}
.setting b{display:block;font-size:15px;font-weight:600}
.setting small{display:block;margin-top:2px;font-size:13px;line-height:1.35;color:var(--label-2)}
.switch{position:relative;flex:none;width:51px;height:31px}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--fill-2);transition:background .25s var(--ease);pointer-events:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.22);transition:transform .35s var(--spring)}
.switch input:checked+i{background:var(--rest)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2.5px solid var(--ring);outline-offset:2px}
.note{margin-top:16px}
.note b{display:block;font-size:15px;font-weight:600}
.note p{margin:4px 0 12px;font-size:14px;line-height:1.45;color:var(--label-2);max-width:46ch}

.toast{position:fixed;z-index:40;top:calc(12px + env(safe-area-inset-top,0px));left:50%;box-sizing:border-box;max-width:calc(100% - 32px);transform:translate(-50%,-16px);opacity:0;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .25s var(--ease),transform .45s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ear{position:fixed;left:50%;bottom:0;width:2px;height:2px;padding:0;margin:0;border:0;opacity:0;resize:none;overflow:hidden;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none}

@media (max-width:420px){
  .dock{gap:18px}
  .sheet-head{padding:24px 14px 4px 20px}
  .sheet-body{padding:10px 20px 20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

<script>
(() => {
  'use strict';

  /* ---------- elements & helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const el = {
    app: $('app'), stage: $('stage'), hero: $('hero'), timer: $('timer'), caption: $('caption'), said: $('said'), reply: $('reply'), capActions: $('capActions'),
    kind: $('kind'), time: $('time'), title: $('title'), sub: $('sub'), next: $('next'), demoChip: $('demoChip'),
    planBtn: $('planBtn'), planBadge: $('planBadge'), talkBtn: $('talkBtn'), talkLbl: $('talkLbl'), quiet: $('quiet'), playBtn: $('playBtn'), moreBtn: $('moreBtn'),
    ear: $('ear'), scrim: $('scrim'), planSheet: $('planSheet'), planTitle: $('planTitle'), planSummary: $('planSummary'), planBody: $('planBody'),
    moreSheet: $('moreSheet'), tPlus: $('tPlus'), tSkip: $('tSkip'), tEnd: $('tEnd'), tEndLbl: $('tEndLbl'), tReset: $('tReset'), tDemo: $('tDemo'),
    optVoice: $('optVoice'), optAuto: $('optAuto'), optTick: $('optTick'), voiceNote: $('voiceNote'), toast: $('toast')
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const clampInt = (v, lo, hi, d) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
  const pad = (n) => String(n).padStart(2, '0');
  const fmtClock = (ms) => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const fmtMMSS = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return pad(Math.floor(t / 60)) + ':' + pad(t % 60); };
  const fmtDur = (min) => { min = Math.round(min); if (min < 60) return min + ' min'; const h = Math.floor(min / 60), m = min % 60; return m ? h + ' h ' + m + ' min' : h + ' h'; };
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  const isBreak = (b) => !!b && b.type !== 'focus';
  const sentence = (s) => { s = String(s || '').trim().replace(/[.!?…]+$/, ''); return s ? s + '.' : ''; };
  const kindLabel = (b) => b.type === 'short' ? 'Short break' : b.type === 'long' ? 'Long break' : b.type === 'break' ? b.task : 'Focus';
  const nameOf = (b) => isBreak(b) ? kindLabel(b) : b.task;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const tail = (s, n) => { s = String(s || ''); return s.length > n ? '…' + s.slice(s.length - n).replace(/^\S*\s/, '') : s; };
  const reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  const PLATFORM = (() => {
    const ua = navigator.userAgent || '';
    const p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
    if (/iPhone|iPad|iPod|Android/i.test(ua) || (/Mac/i.test(p) && navigator.maxTouchPoints > 1)) return 'touch';
    if (/Win/i.test(p)) return 'win';
    if (/Mac/i.test(p)) return 'mac';
    return 'other';
  })();
  const DICTATE = { win: 'Press Win + H, then speak.', mac: 'Press Fn twice to dictate, then speak.', touch: 'Tap the mic on your keyboard, then speak.', other: 'Turn on your device’s voice typing, then speak.' }[PLATFORM];
  const DICTATE_STEP = { win: 'press Win + H', mac: 'press Fn twice', touch: 'tap the mic on your keyboard', other: 'turn on voice typing' }[PLATFORM];

  /* ---------- state ---------- */
  const STORE = 'focustalk:v2';
  const RHYTHM = { short: 5, long: 15, every: 4 };
  const MAX_TURNS = 16;
  const fresh = () => ({ v: 2, settings: { voice: true, auto: true, tick: true }, turns: [], said: '', reply: '', proposal: null, session: null });
  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.v !== 2) return null;
      const out = Object.assign(fresh(), s);
      out.settings = Object.assign({ voice: true, auto: true, tick: true }, s.settings || {});
      if (!Array.isArray(out.turns)) out.turns = [];
      if (out.session && !(Array.isArray(out.session.blocks) && out.session.blocks.length)) out.session = null;
      if (out.proposal && !(Array.isArray(out.proposal.blocks) && out.proposal.blocks.length)) out.proposal = null;
      return out;
    } catch (e) { return null; }
  }
  let state = load() || fresh();
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
  const ui = { busy: false, ctl: null, listen: null, speaking: false, sheet: null, captionUntil: 0, plannerOff: false, endArmed: false, endTimer: null, micMode: null, micWorked: false, soundHint: false };

  /* ---------- the planner (Claude) ---------- */
  const RULES = `You plan focus sessions inside FocusTalk, a Pomodoro timer people talk to. Their words reach you through speech-to-text, so expect filler words and loose punctuation. You turn what they say into a schedule of focus blocks; the app runs the timer and says out loud what to do in each block.

Planning rules:
1. Find every task. Name each in 2 to 5 words, keeping their wording.
2. If they give a time window ("next 3 hours", "until 9 pm"), the whole plan, breaks included, must fit inside it. If they don't, size the plan to the work.
3. Rhythm: 25-minute focus blocks, a 5-minute short break between focus blocks, and a 15-minute long break after every 4th focus block, unless they ask for something else (for example 50/10, or no breaks). The app inserts these short and long breaks itself, so never list them; just set "rhythm".
4. A task can span several focus blocks. Give every focus block a concrete "goal": exactly what to get done in that block, such as "Outline sections 1 to 3". Split big tasks into sensible steps.
5. Order: anything tied to a time or deadline first, then hard or important work while energy is high, quick admin later. Batch tiny tasks (a few emails, a quick call) into one block.
6. Add a "break" block only for a specific break they mention (dinner, gym, a call), with its length.
7. If everything will not fit, keep the most important work and say what you cut or shortened.
8. Focus blocks run 10 to 60 minutes unless they ask otherwise.

If a session is in progress, plan only the rest of it, starting now, and leave finished work out. If they finished the current block early, don't repeat it.

Talking:
- "reply" is spoken aloud. Keep it to 1 to 3 short, warm, plain sentences: how many focus blocks, what comes first, and when it ends, or what changed. No lists, emoji, or markdown.
- Ask at most one question, only when it matters, and still return a complete plan.
- "start" is true only when their latest message clearly means go ("looks good", "start", "let's go", "yes"). During a session in progress, a clear change request also counts as go, unless you asked a question.
- If they say something that isn't about planning, answer briefly in "reply" and return "blocks": [].

Reply with only this JSON object:
{"reply":"...","start":false,"rhythm":{"short":5,"long":15,"every":4},"blocks":[{"type":"focus","task":"Client deck","minutes":25,"goal":"Draft slides 1 to 5"},{"type":"break","task":"Dinner","minutes":30}]}`;

  let samplePromise = null;
  function getSample() {
    if (!samplePromise) {
      samplePromise = (window.claude && typeof window.claude.use === 'function')
        ? Promise.resolve().then(() => window.claude.use('sample')).catch(() => null)
        : Promise.resolve(null);
    }
    return samplePromise;
  }
  async function askPlanner(sample, input, opts) {
    if (typeof sample.json === 'function') {
      try { return await sample.json(input, opts); }
      catch (e) { if (!e || e.code !== 'capability_removed') throw e; }
    }
    const res = await sample(input, opts);
    const raw = String((res && res.text) || '').replace(/```(?:json)?/gi, '').trim();
    const a = raw.indexOf('{'), b = raw.lastIndexOf('}');
    if (a < 0 || b <= a) throw { code: 'invalid_json' };
    try { return JSON.parse(raw.slice(a, b + 1)); } catch (err) { throw { code: 'invalid_json' }; }
  }

  function remaining() { const s = state.session; return s.running ? s.endAt - Date.now() : s.remainingMs; }

  function contextFor(words) {
    const now = Date.now();
    let ctx = 'Time now: ' + fmtClock(now) + ', ' + new Date(now).toLocaleDateString([], { weekday: 'long' }) + '.';
    const s = state.session;
    if (s && !s.finished) {
      const cur = s.blocks[s.idx];
      const left = Math.max(0, Math.round(remaining() / 60000));
      const done = Array.from(new Set(s.blocks.slice(0, s.idx).filter((b) => b.type === 'focus' && b.status === 'done').map((b) => b.task)));
      const rest = s.blocks.slice(s.idx + 1).filter((b) => b.type === 'focus' || b.type === 'break')
        .map((b) => b.type === 'focus' ? b.task + ' (' + b.minutes + ' min' + (b.goal ? ': ' + b.goal : '') + ')' : b.task + ' break (' + b.minutes + ' min)');
      ctx += '\nSession in progress. Finished so far: ' + (done.length ? done.join('; ') : 'nothing yet') + '.';
      ctx += '\nCurrent block: ' + (cur.type === 'focus' ? cur.task + (cur.goal ? ' (' + cur.goal + ')' : '') : 'a break') + ', ' + left + ' of ' + cur.minutes + ' min left.';
      ctx += '\nPlanned after it: ' + (rest.length ? rest.join('; ') : 'nothing') + '.';
    }
    return ctx + '\n\nWhat they said: "' + words + '"';
  }

  function normalize(d) {
    if (!d || typeof d !== 'object' || Array.isArray(d)) return null;
    const reply = typeof d.reply === 'string' ? d.reply.trim().slice(0, 600) : '';
    const r = (d.rhythm && typeof d.rhythm === 'object') ? d.rhythm : {};
    const rhythm = { short: clampInt(r.short, 0, 30, RHYTHM.short), long: clampInt(r.long, 0, 60, RHYTHM.long), every: clampInt(r.every, 0, 12, RHYTHM.every) };
    const blocks = (Array.isArray(d.blocks) ? d.blocks : []).map((b) => {
      if (!b || typeof b !== 'object') return null;
      const t = String(b.type || 'focus').toLowerCase();
      if (/short|long/.test(t)) return null;
      const type = t === 'break' ? 'break' : 'focus';
      const task = String(b.task || '').trim().slice(0, 80) || (type === 'focus' ? 'Focus' : 'Break');
      return { type, task, minutes: clampInt(b.minutes, 1, 240, type === 'focus' ? 25 : 10), goal: typeof b.goal === 'string' ? b.goal.trim().slice(0, 160) : '' };
    }).filter(Boolean).slice(0, 40);
    if (!reply && !blocks.length) return null;
    return { reply, start: d.start === true, rhythm, blocks };
  }

  // The planner lists focus blocks and special breaks; the app inserts the regular short and long breaks.
  function expand(plan, base) {
    const r = plan.rhythm || RHYTHM, items = plan.blocks, out = [];
    let n = base || 0;
    items.forEach((b, i) => {
      out.push(Object.assign({}, b));
      if (b.type === 'break' && b.minutes >= (r.long || 15)) n = 0;
      if (b.type !== 'focus') return;
      n++;
      const next = items[i + 1];
      if (!next || next.type !== 'focus') return;
      const long = r.every > 0 && n % r.every === 0;
      const m = long ? r.long : r.short;
      if (m > 0) out.push({ type: long ? 'long' : 'short', task: long ? 'Long break' : 'Short break', minutes: m, goal: '' });
    });
    while (out.length && out[out.length - 1].type !== 'focus') out.pop();
    return out;
  }

  function focusSinceLong() {
    const s = state.session; let n = 0;
    if (!s) return 0;
    for (let i = 0; i < s.idx; i++) {
      const b = s.blocks[i];
      if (b.type === 'long' || (b.type === 'break' && b.minutes >= 15)) n = 0;
      else if (b.type === 'focus' && b.status === 'done' && !b.partial) n++;
    }
    return n;
  }

  const OFF_CODES = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  function errorCopy(code) {
    switch (code) {
      case 'rate_limited': return 'Too many requests right now. Wait a minute, then tap the mic again.';
      case 'session_expired': return 'Your Claude sign-in expired. Sign in again, then tap the mic.';
      case 'refused': return 'I couldn’t plan from that. Try saying your tasks another way.';
      case 'prompt_too_large': return 'That was a lot at once. Try a shorter list.';
      case 'invalid_json': case 'empty_completion': return 'The plan came back incomplete. Tap the mic and say it once more.';
      default: return 'I couldn’t reach the planner. Check your connection, then tap the mic to try again.';
    }
  }

  /* ---------- example for explaining the idea ---------- */
  const DEMO_LINE = "I've got two and a half hours tonight. I need to finish the client deck, study SQL for about forty minutes, and reply to three emails. Dinner somewhere in the middle.";
  const DEMO_PLAN = { reply: 'Here’s your evening: five focus blocks with dinner in the middle, done in about two and a half hours. First up, the client deck.', start: false, rhythm: { short: 5, long: 15, every: 4 }, blocks: [
    { type: 'focus', task: 'Client deck', minutes: 25, goal: 'Outline the story and the first slides' },
    { type: 'focus', task: 'Client deck', minutes: 25, goal: 'Finish the slides and send for review' },
    { type: 'focus', task: 'SQL study', minutes: 25, goal: 'Joins and window functions' },
    { type: 'break', task: 'Dinner', minutes: 30 },
    { type: 'focus', task: 'SQL study', minutes: 15, goal: 'Practice problems' },
    { type: 'focus', task: 'Emails', minutes: 15, goal: 'Reply to all three' }
  ] };

  /* ---------- fallback planner (only when Claude isn't available) ---------- */
  const NUMW = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5 };
  const DUR_RE = /\b(?:for\s+)?(?:about\s+|around\s+)?(\d+(?:\.\d+)?|half an?|an?|one|two|three|four|five)\s*(hours?|hrs?|minutes?|mins?)\b/i;
  function parseLocal(text) {
    const out = [];
    const pieces = text.split(/\n|;|,|\.\s+|\band then\b|\bthen\b|\bafter that\b|\balso\b/i).map((p) => p.trim()).filter(Boolean);
    for (let p of pieces) {
      p = p.replace(/^(and|so|okay|ok|um+|uh+)\s+/i, '')
           .replace(/^(i\s+(?:need|have|want|got)\s+to|i['’]?ve\s+got\s+to|i\s+gotta|need\s+to|have\s+to|gotta)\s+/i, '').trim();
      if (!p) continue;
      const dm = p.match(DUR_RE);
      if (dm && /^(i['’]?ve got|i have got|i got|i have|got|for the next|next|until|in the next|within)\b/i.test(p)) continue;
      let mins = 25;
      if (dm) {
        const q = /^half/i.test(dm[1]) ? 0.5 : (dm[1].toLowerCase() in NUMW ? NUMW[dm[1].toLowerCase()] : parseFloat(dm[1]));
        mins = /^h/i.test(dm[2]) ? q * 60 : q;
      }
      let name = p.replace(DUR_RE, '').replace(/\s{2,}/g, ' ').replace(/^[\s\-–—:]+|[\s\-–—:.]+$/g, '').trim();
      if (name.length < 2) continue;
      name = name.charAt(0).toUpperCase() + name.slice(1);
      mins = Math.max(10, Math.min(240, Math.round(mins || 25)));
      const n = Math.max(1, Math.round(mins / 25));
      const per = n === 1 ? Math.min(60, mins) : Math.round(mins / n);
      for (let i = 0; i < n; i++) out.push({ type: 'focus', task: name.slice(0, 60), minutes: per, goal: n > 1 ? 'Part ' + (i + 1) + ' of ' + n : '' });
      if (out.length >= 24) break;
    }
    return out.slice(0, 24);
  }

  function offlineTurn(words, demo, wasRunning) {
    if (demo) {
      setReply(DEMO_PLAN.reply);
      applyPlan(normalize(DEMO_PLAN));
    } else {
      const live = !!(state.session && !state.session.finished);
      const blocks = parseLocal(words);
      if (blocks.length) {
        state.proposal = { blocks: expand({ rhythm: RHYTHM, blocks }, live ? focusSinceLong() : 0), replan: live };
        setReply('Here’s a simple plan: ' + plural(blocks.length, 'focus block') + ', in the order you said them. Say “start” or tap play.');
      } else {
        setReply('Tell me your tasks one after another, like “emails, then the report for an hour, then the gym bag.”');
        if (wasRunning) resumeSession(true);
      }
    }
    save(); render();
  }

  /* ---------- quick voice commands that need no planning ---------- */
  function localCommand(words) {
    const w = words.toLowerCase().replace(/[.,!?’']/g, '').replace(/\s+/g, ' ').trim();
    if (!w || w.split(' ').length > 6) return null;
    const s = state.session, live = !!(s && !s.finished), P = state.proposal;
    if (P && /^(start|go|begin|lets go|lets start|lets do (it|this)|looks good|sounds good|start (it|now|the session|session)|do it|ok(ay)? start|yes start|start please)$/.test(w)) return 'accept';
    if (live && s.running && /^(pause|pause (it|the timer)|hold on|wait)$/.test(w)) return 'pause';
    if (live && !s.running && !P && /^(resume|continue|keep going|unpause|start|go|start the timer)$/.test(w)) return 'resume';
    if (live && /^(skip|skip (it|this|this block|the block)|next|next block)$/.test(w)) return 'skip';
    if (live && /^((add|give me|plus) (five|5) (more )?min(ute)?s?|(five|5) more min(ute)?s?)$/.test(w)) return 'plus';
    if (live && /^((end|stop|finish) (the )?session)$/.test(w)) return 'end';
    return null;
  }
  function runCommand(cmd) {
    if (cmd === 'accept') { setReply('Starting now.', true); acceptProposal(false); }
    else if (cmd === 'pause') { pauseSession(); setReply('Paused.'); }
    else if (cmd === 'resume') { resumeSession(); setReply('Back to it.'); }
    else if (cmd === 'skip') { setReply('Skipped.', true); skip(); }
    else if (cmd === 'plus') { addFive(); setReply('Added five minutes.'); }
    else if (cmd === 'end') { setReply('Session ended.', true); endSession(); }
  }

  function setReply(text, quiet) {
    state.reply = text || '';
    ui.captionUntil = Date.now() + 15000;

    if (s && s.running && Date.now() >= s.endAt) advance();
    if (s && s.running && !s.finished && state.settings.tick !== false && document.visibilityState === 'visible') {
      const sec = Math.floor((s.endAt - Date.now()) / 1000);
      if (sec !== lastTickSec) { if (lastTickSec !== null && sec >= 0) tickSound(sec % 2); lastTickSec = sec; }
    } else lastTickSec = null;
    const L = ui.listen;
    if (L && L.mode !== 'demo' && !L.text && Date.now() - L.start > 30000) finishListening(false, true);
    paintTimer();
    renderReadout(phase());
    renderCaption();
  }

  /* ---------- start ---------- */
  const SOUND_HINT = 'Tap anywhere to turn the alarm sound back on.';
  pickVoice();
  try { if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {}
  getSample();
  if (state.session && state.session.running) {
    if (Date.now() >= state.session.endAt) advance();
    if (state.session && state.session.running) { ui.soundHint = true; state.said = ''; setReply(SOUND_HINT, true); ui.captionUntil = Date.now() + 20000; }
  }
  render();
  setInterval(tick, 250);
})();
</script>

</body></html>
